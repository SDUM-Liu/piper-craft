[project]
name = "piper-craft"
version = "0.2.0"
description = "RGB desktop teleoperation with regularized MOVE_J and bounded operation memory"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.10,<5",
  "scipy>=1.12,<2",
  "pyyaml>=6,<7",
  "av>=13,<17",
  "pygame-ce>=2.5,<3",
  "pyrealsense2==2.55.1.6486",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
piper-craft = "astra_vla.launcher:main"
piper-craft-desktop = "astra_vla.teleop_desktop:main"
piper-craft-message = "astra_vla.codex_messages:main"
piper-craft-memory = "astra_vla.operation_memory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astra_vla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
