name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.11 --group dev
      - run: uv run pytest -q
      - run: uv run python -m astra_vla.operation_memory compact
      - run: uv run python scripts/check_robot_memory.py
